document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"><span style=\"width:10px;height:10px;border-radius:2px;background:#dc4b4b\"><\u002Fspan>Negative (1–5)<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <svg sc-camel-view-box=\"0 0 600 256\" style=\"width:100%;height:auto;display:block\" sc-camel-on-mouse-leave=\"{{ clearBar }}\">\n          <g stroke=\"#eceff3\" sc-camel-stroke-width=\"1\">\n            <line x1=\"44\" x2=\"584\" y1=\"16\" y2=\"16\"><\u002Fline><line x1=\"44\" x2=\"584\" y1=\"68.5\" y2=\"68.5\"><\u002Fline><line x1=\"44\" x2=\"584\" y1=\"121\" y2=\"121\"><\u002Fline><line x1=\"44\" x2=\"584\" y1=\"173.5\" y2=\"173.5\"><\u002Fline>\n          <\u002Fg>\n          <g fill=\"#6b7685\" sc-camel-font-size=\"11\" sc-camel-text-anchor=\"end\">\n            <text x=\"30\" y=\"20\">28<\u002Ftext><text x=\"30\" y=\"72.5\">21<\u002Ftext><text x=\"30\" y=\"125\">14<\u002Ftext><text x=\"30\" y=\"177.5\">7<\u002Ftext><text x=\"30\" y=\"230\">0<\u002Ftext>\n          <\u002Fg>\n          <sc-for list=\"{{ xLabels }}\" as=\"xl\" hint-placeholder-count=\"0\">\n            <text x=\"{{ xl.x }}\" y=\"248\" fill=\"#6b7685\" sc-camel-font-size=\"11\" sc-camel-text-anchor=\"middle\">{{ xl.label }}<\u002Ftext>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"0\">\n            <g opacity=\"{{ b.opacity }}\">\n              <rect x=\"{{ b.x }}\" y=\"{{ b.posY }}\" width=\"28\" height=\"{{ b.posH }}\" fill=\"#2f6fd6\" rx=\"2\"><\u002Frect>\n              <rect x=\"{{ b.x }}\" y=\"{{ b.neuY }}\" width=\"28\" height=\"{{ b.neuH }}\" fill=\"#bcc3cc\"><\u002Frect>\n              <rect x=\"{{ b.x }}\" y=\"{{ b.negY }}\" width=\"28\" height=\"{{ b.negH }}\" fill=\"#dc4b4b\"><\u002Frect>\n            <\u002Fg>\n            <rect x=\"{{ b.hitX }}\" y=\"10\" width=\"49\" height=\"222\" fill=\"transparent\" sc-camel-on-mouse-enter=\"{{ b.onEnter }}\"><\u002Frect>\n          <\u002Fsc-for>\n          <line x1=\"44\" x2=\"584\" y1=\"226\" y2=\"226\" stroke=\"#c9d0d8\" sc-camel-stroke-width=\"1\"><\u002Fline>\n        <\u002Fsvg>\n        <sc-if value=\"{{ hasBarTip }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:0;left:{{ barTip.left }};transform:translateX(-50%);background:#12233a;color:#fff;border-radius:8px;padding:10px 12px;font-size:12px;pointer-events:none;min-width:160px;box-shadow:0 6px 20px rgba(18,35,58,.25);display:flex;flex-direction:column;gap:5px\">\n            <strong style=\"font-weight:700\">Week of {{ barTip.label }}<\u002Fstrong>\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#5b93ea\"><\u002Fspan><span style=\"flex:1;color:#c9d3df\">Positive<\u002Fspan><strong style=\"font-weight:600\">{{ barTip.pos }}<\u002Fstrong><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#bcc3cc\"><\u002Fspan><span style=\"flex:1;color:#c9d3df\">Neutral<\u002Fspan><strong style=\"font-weight:600\">{{ barTip.neu }}<\u002Fstrong><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#ef6b6b\"><\u002Fspan><span style=\"flex:1;color:#c9d3df\">Negative<\u002Fspan><strong style=\"font-weight:600\">{{ barTip.neg }}<\u002Fstrong><\u002Fdiv>\n            <div style=\"display:flex;gap:6px;border-top:1px solid #2c4160;padding-top:5px\"><span style=\"flex:1;color:#c9d3df\">Total<\u002Fspan><strong style=\"font-weight:700\">{{ barTip.total }}<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleBarTable }}\" style=\"align-self:flex-start;background:none;border:none;padding:0;font:inherit;font-size:13px;font-weight:600;color:#1f5fbf;cursor:pointer\">{{ barTableLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ barTable }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;display:flex;flex-direction:column;border:1px solid #eef1f4;border-radius:8px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:8px;padding:8px 12px;background:#f6f8fa;font-weight:600;color:#5a6676;font-size:12px\"><span>Week of<\u002Fspan><span>Positive<\u002Fspan><span>Neutral<\u002Fspan><span>Negative<\u002Fspan><span>Total<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ barRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n            <div style=\"display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:8px;padding:7px 12px;border-top:1px solid #eef1f4\"><span>{{ r.week }}<\u002Fspan><span>{{ r.pos }}<\u002Fspan><span>{{ r.neu }}<\u002Fspan><span>{{ r.neg }}<\u002Fspan><strong style=\"font-weight:600\">{{ r.total }}<\u002Fstrong><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;max-width:640px\">\n        <h2 style=\"margin:0;font-size:21px;font-weight:700\">What guests talk about<\u002Fh2>\n        <p style=\"margin:0;font-size:14px;color:#5a6676;line-height:1.45\">Topics from written comments, 3 Aug – 23 Oct 2026, compared with 13 May – 2 Aug 2026.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n        <span style=\"font-size:13px;color:#5a6676;font-weight:600\">Sort by<\u002Fspan>\n        <div style=\"display:flex;padding:3px;border-radius:10px;background:#e7ebf0;gap:2px\">\n          <sc-for list=\"{{ sortOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"border:none;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.shadow }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e2e6eb;border-radius:12px;overflow-x:auto\">\n      <div style=\"min-width:880px\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr);gap:20px;padding:12px 20px;background:#f6f8fa;border-bottom:1px solid #e2e6eb;font-size:12px;font-weight:600;color:#5a6676\">\n          <span>Topic<\u002Fspan><span>Complaints<\u002Fspan><span>Change vs previous period<\u002Fspan><span>In negative reviews<\u002Fspan><span>Praise<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"10\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr);gap:20px;padding:16px 20px;border-top:1px solid #eef1f4;align-items:start;font-size:14px\" style-hover=\"background:#fafbfc\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><strong style=\"font-weight:700\">{{ t.name }}<\u002Fstrong>\n                <sc-if value=\"{{ t.urgent }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fde8e8;color:#a12a2a;text-transform:uppercase;letter-spacing:.04em\">Always follow up<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ showDesc }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:13px;color:#5a6676;line-height:1.45\">{{ t.desc }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;justify-content:space-between;gap:8px\"><a href=\"#\" style=\"font-weight:600\">{{ t.c }} reviews<\u002Fa><span style=\"color:#5a6676;font-size:13px\">{{ t.share }}% of all<\u002Fspan><\u002Fdiv>\n              <div style=\"height:6px;border-radius:3px;background:#eef1f4\"><div style=\"height:100%;border-radius:3px;background:#dc4b4b;width:{{ t.cW }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px;align-items:flex-start\">\n              <span style=\"font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;color:{{ t.trendFg }};background:{{ t.trendBg }}\">{{ t.trendText }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#5a6676\">{{ t.trendNote }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <strong style=\"font-weight:600\">{{ t.negPct }}%<\u002Fstrong>\n              <span style=\"font-size:12px;color:#5a6676\">{{ t.negN }} of 63<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <a href=\"#\" style=\"font-weight:600\">{{ t.p }} reviews<\u002Fa>\n              <div style=\"height:6px;border-radius:3px;background:#eef1f4\"><div style=\"height:100%;border-radius:3px;background:#2f6fd6;width:{{ t.pW }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:#5a6676;line-height:1.55;max-width:820px;text-wrap:pretty\">Topics are tagged automatically from guests’ words, so treat them as a guide and read the reviews behind any number before acting on it. “Better” means the topic’s share of complaints went down. <a href=\"#\">How topics are tagged<\u002Fa><\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTopicDescriptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;showSparklines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nconst WEEKS = ['3 Aug','10 Aug','17 Aug','24 Aug','31 Aug','7 Sep','14 Sep','21 Sep','28 Sep','5 Oct','12 Oct','19 Oct'];\nconst PROPS = [\n  { id:'oly', name:'Olympic Hotel Paddington', short:'Olympic', color:'#2f6fd6', week:6.5, weekN:2, last:5.6, lastN:8, change:0.9, avg:6.5, avgN:73, neg:37, top:'Facilities & amenities', topN:18, bk:6.8, bkN:'85 reviews', series:[4.8,6.7,7.3,8.1,5.2,9.3,9.3,6.1,5.9,5.7,5.6,6.5] },\n  { id:'pot', name:'Potts Point', short:'Potts Point', color:'#e8662c', week:4.5, weekN:2, last:4.5, lastN:2, change:0, avg:5.3, avgN:22, neg:50, top:'Cleanliness', topN:6, bk:6.4, bkN:'2,444 reviews', series:[null,6.5,7.5,1.0,1.0,10,4.0,9.0,5.0,5.6,4.5,4.5] },\n  { id:'cen', name:'Central Sydney', short:'Central', color:'#17a079', week:6.7, weekN:3, last:3.0, lastN:2, change:3.7, avg:6.7, avgN:31, neg:32, top:'Cleanliness', topN:6, bk:6.7, bkN:'2,480 reviews', series:[null,4.8,5.0,8.5,7.0,8.0,7.0,7.5,10,7.8,3.0,6.7] },\n  { id:'dar', name:'Darling Harbour', short:'Darling', color:'#e0a10f', week:4.8, weekN:5, last:5.0, lastN:7, change:-0.2, avg:6.0, avgN:97, neg:40, top:'Cleanliness', topN:26, bk:6.7, bkN:'4,333 reviews', series:[4.3,5.4,5.0,6.8,7.1,8.3,9.1,4.0,5.8,6.3,5.0,4.8] }\n];\nconst BARS = [[4,1,7],[8,5,8],[7,2,8],[8,5,3],[13,4,11],[14,3,2],[7,2,4],[7,3,11],[5,6,6],[10,7,11],[4,5,10],[4,2,6]];\nconst TOPICS = [\n  { name:'Cleanliness', desc:'Dirty rooms or bathrooms, smells, stains, mould, housekeeping.', c:53, share:48, pts:-13, was:61, negPct:62, negN:39, p:14 },\n  { name:'Room condition & comfort', desc:'Bed, linen, room size, broken or worn fittings, maintenance, leaks, temperature, comfort.', c:43, share:39, pts:2, was:37, negPct:51, negN:32, p:27 },\n  { name:'Facilities & amenities', desc:'Shared bathrooms, kitchen, lift/stairs, Wi-Fi, air-con, hot water, laundry, common areas, supplies, the free dinner.', c:37, share:34, pts:-21, was:54, negPct:38, negN:24, p:22 },\n  { name:'Check-in & access', desc:'Arrival, check-in/out process, virtual reception, door codes, keys, instructions.', c:23, share:21, pts:4, was:17, negPct:21, negN:13, p:13 },\n  { name:'Staff & service', desc:'Friendliness, helpfulness and attitude of staff and (virtual) receptionists; responsiveness.', c:18, share:16, pts:1, was:15, negPct:21, negN:13, p:23 },\n  { name:'Value for money', desc:'Price versus what was received, extra charges, refunds, billing problems.', c:14, share:13, pts:2, was:11, negPct:21, negN:13, p:16 },\n  { name:'Noise', desc:'Noise from other guests, doors, street, pubs, thin walls; trouble sleeping.', c:11, share:10, pts:-3, was:13, negPct:11, negN:7, p:2 },\n  { name:'Location', desc:'Proximity to transport, venues, the CBD and amenities; the neighbourhood and safety of the area.', c:10, share:9, pts:3, was:7, negPct:6, negN:4, p:56 },\n  { name:'Pests', desc:'Cockroaches, bed bugs, insects, rodents.', c:6, share:5, pts:-1, was:7, negPct:6, negN:4, p:0, urgent:true },\n  { name:'Safety & security', desc:'Feeling unsafe, theft, drugs, aggressive or intoxicated people, door security, police.', c:5, share:5, pts:0, was:4, negPct:8, negN:5, p:0, urgent:true }\n];\nconst X0 = 44, X1 = 584, Y0 = 226, YT = 16;\nconst xAt = i => X0 + i * (X1 - X0) / 11;\nconst fmt = v => v == null ? '—' : v.toFixed(1);\nconst leftPct = i => Math.min(80, Math.max(20, xAt(i) / 600 * 100)) + '%';\n\nclass Component extends DCLogic {\n  state = { focus:'all', hoverLine:null, hoverBar:null, sort:'complaints', lineTable:false, barTable:false };\n\n  renderVals() {\n    const s = this.state;\n    const ry = v => Y0 - v * (Y0 - YT) / 10;\n    const by = v => Y0 - v * (Y0 - YT) / 28;\n\n    const properties = PROPS.map(p => {\n      const up = p.change > 0, down = p.change < 0;\n      const pts = p.series.map((v, i) => v == null ? null : `${(4 + i * 232 / 11).toFixed(1)},${(44 - v * 4).toFixed(1)}`).filter(Boolean).join(' ');\n      return {\n        ...p, week: p.week.toFixed(1), avg: p.avg.toFixed(1), bk: p.bk.toFixed(1), negText: p.neg + '%',\n        changeText: up ? `▲ +${p.change.toFixed(1)}` : down ? `▼ −${Math.abs(p.change).toFixed(1)}` : 'No change',\n        chipColor: up ? '#1a7f45' : down ? '#b32a2a' : '#4a5565',\n        chipBg: up ? '#e3f3ea' : down ? '#fde8e8' : '#eef1f4',\n        weekNote: `From ${p.weekN} reviews · last week ${p.last.toFixed(1)} (${p.lastN} reviews)`,\n        lowSample: p.weekN < 5, spark: pts\n      };\n    });\n\n    const lines = PROPS.map(p => {\n      const on = s.focus === 'all' || s.focus === p.id;\n      const pts = p.series.map((v, i) => v == null ? null : { cx: xAt(i).toFixed(1), cy: ry(v).toFixed(1), i }).filter(Boolean);\n      return {\n        on, color: on ? p.color : '#d3d9e0', width: on ? 2.5 : 1.5,\n        points: pts.map(q => q.cx + ',' + q.cy).join(' '),\n        dots: pts.map(q => ({ cx: q.cx, cy: q.cy, r: on ? (s.hoverLine === q.i ? 5 : 3.2) : 2.2 }))\n      };\n    }).sort((a, b) => a.on - b.on);\n\n    const legend = [{ id:'all', label:'All properties', color:'#8a95a3' }, ...PROPS.map(p => ({ id:p.id, label:p.short, color:p.color }))].map(c => {\n      const active = s.focus === c.id;\n      return { ...c, bg: active ? '#12233a' : '#fff', fg: active ? '#fff' : '#1b2430', border: active ? '#12233a' : '#cdd4dc', onClick: () => this.setState({ focus: c.id }) };\n    });\n\n    const hl = s.hoverLine;\n    const lineTip = hl == null ? null : {\n      label: WEEKS[hl], left: leftPct(hl),\n      rows: PROPS.filter(p => s.focus === 'all' || s.focus === p.id).map(p => ({ name: p.short, color: p.color, val: p.series[hl] == null ? 'No reviews' : p.series[hl].toFixed(1) }))\n    };\n\n    const hb = s.hoverBar;\n    const bars = BARS.map(([pos, neu, neg], i) => {\n      const x = (xAt(i) - 14).toFixed(1);\n      return {\n        x, hitX: (xAt(i) - 24.5).toFixed(1),\n        negY: by(neg), negH: Y0 - by(neg),\n        neuY: by(neg + neu), neuH: by(neg) - by(neg + neu),\n        posY: by(neg + neu + pos), posH: by(neg + neu) - by(neg + neu + pos),\n        opacity: hb == null || hb === i ? 1 : 0.4,\n        onEnter: () => this.setState({ hoverBar: i })\n      };\n    });\n    const barTip = hb == null ? null : { label: WEEKS[hb], left: leftPct(hb), pos: BARS[hb][0], neu: BARS[hb][1], neg: BARS[hb][2], total: BARS[hb][0] + BARS[hb][1] + BARS[hb][2] };\n\n    const sorters = { complaints: (a, b) => b.c - a.c, change: (a, b) => Math.abs(b.pts) - Math.abs(a.pts) || b.pts - a.pts, praise: (a, b) => b.p - a.p };\n    const topics = [...TOPICS].sort(sorters[s.sort]).map(t => {\n      const better = t.pts < 0, worse = t.pts > 0;\n      return {\n        ...t, urgent: !!t.urgent, cW: (t.c / 53 * 100) + '%', pW: (t.p / 56 * 100) + '%',\n        trendText: better ? `▼ Better · ${Math.abs(t.pts)} pts` : worse ? `▲ Worse · ${t.pts} pts` : 'No change',\n        trendFg: better ? '#1a7f45' : worse ? '#b32a2a' : '#4a5565',\n        trendBg: better ? '#e3f3ea' : worse ? '#fde8e8' : '#eef1f4',\n        trendNote: `was ${t.was}%, now ${t.share}% of complaints`\n      };\n    });\n    const sortOpts = [['complaints','Most complaints'],['change','Biggest change'],['praise','Most praise']].map(([id, label]) => {\n      const a = s.sort === id;\n      return { label, bg: a ? '#fff' : 'transparent', fg: a ? '#1b2430' : '#4a5565', shadow: a ? '0 1px 3px rgba(18,35,58,.15)' : 'none', onClick: () => this.setState({ sort: id }) };\n    });\n\n    return {\n      properties, lines, legend, bars, topics, sortOpts,\n      showSpark: this.props.showSparklines ?? true,\n      showDesc: this.props.showTopicDescriptions ?? true,\n      xLabels: [0,2,4,6,8,11].map(i => ({ x: xAt(i).toFixed(1), label: WEEKS[i] })),\n      lineHits: WEEKS.map((w, i) => ({ x: (xAt(i) - 24.5).toFixed(1), onEnter: () => this.setState({ hoverLine: i }) })),\n      guideX: hl == null ? 0 : xAt(hl), guideOpacity: hl == null ? 0 : 1,\n      hasLineTip: hl != null, lineTip: lineTip || { rows: [] },\n      hasBarTip: hb != null, barTip: barTip || {},\n      clearLine: () => this.setState({ hoverLine: null }),\n      clearBar: () => this.setState({ hoverBar: null }),\n      lineTable: s.lineTable, barTable: s.barTable,\n      lineTableLabel: s.lineTable ? '▾ Hide table' : '▸ Show as table',\n      barTableLabel: s.barTable ? '▾ Hide table' : '▸ Show as table',\n      toggleLineTable: () => this.setState({ lineTable: !s.lineTable }),\n      toggleBarTable: () => this.setState({ barTable: !s.barTable }),\n      lineRows: WEEKS.map((w, i) => ({ week: w, a: fmt(PROPS[0].series[i]), b: fmt(PROPS[1].series[i]), c: fmt(PROPS[2].series[i]), d: fmt(PROPS[3].series[i]) })),\n      barRows: WEEKS.map((w, i) => ({ week: w, pos: BARS[i][0], neu: BARS[i][1], neg: BARS[i][2], total: BARS[i][0] + BARS[i][1] + BARS[i][2] }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
